# Builds the Windows installer / portable .exe and the Android .apk and puts them
# on the repository's Releases page. Run it from Actions → "Build apps" → Run
# workflow, or push a tag like v1.0.1.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/PDF-Reader-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" files/* --clobber
          else
            gh release create "$tag" files/* --title "PDF Reader ${version}" --notes "Windows: PDF-Reader-Setup-${version}.exe (installer) or PDF-Reader-${version}-portable.exe (no install). Android: PDF-Reader-${version}.apk."
          fi
