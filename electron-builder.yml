# Desktop packages. `npm run dist:win` builds the Windows installer and a
# portable .exe into release/ (on Linux the installer step needs Wine);
# `npm run dist:mac` builds the macOS disk image and only runs on a Mac.
appId: io.github.valeratim777.pdfreader
productName: PDF Reader
copyright: Copyright © 2026 valeratim777
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF document
    mimeType: application/pdf
    role: Editor
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No code-signing certificate; icon and version info are still written into the .exe.
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PDF Reader
  # Installer screens follow the Windows display language.
  multiLanguageInstaller: true
  installerLanguages: [ru_RU, en_US]
  artifactName: PDF-Reader-Setup-${version}.exe
portable:
  artifactName: PDF-Reader-${version}-portable.exe
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    # One app for both Apple Silicon and Intel Macs.
    - target: dmg
      arch: [universal]
  # No Apple Developer ID: the app is ad-hoc signed (Apple Silicon refuses to run
  # unsigned code) and not notarized, so macOS asks once before the first launch.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: PDF-Reader-${version}-mac.dmg
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Office
